<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบเช็คชื่อเข้าใช้งาน</title>

<style>
body{
  font-family: Arial, sans-serif;
  background: linear-gradient(
      rgba(155, 89, 182, 0.6),
      rgba(255, 255, 255, 0.8)
    ),
    url("image/ddd.png");
  background-size: cover;
  background-position: center;
  min-height: 100vh;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
}

.form-container{
  background: rgba(255,255,255,0.95);
  padding: 20px;
  width: 100%;
  max-width: 380px;
  border-radius: 12px;
  box-shadow: 0 6px 15px rgba(0,0,0,.25);
}

.form-container img{
  display:block;
  margin:0 auto 10px;
  width:80px;
}

h2{
  text-align:center;
  margin-bottom:15px;
}

input{
  width:100%;
  padding:8px;
  margin-bottom:10px;
  border-radius:6px;
  border:1px solid #ccc;
}

button{
  width:100%;
  padding:10px;
  background:#00c853;
  color:#fff;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#00a843;
}
.stats-btn{
  margin-top:8px;
  width:100%;
  padding:10px;
  background:#2979ff;
  color:#fff;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}

.stats-btn:hover{
  background:#1c54b2;
}

</style>
</head>

<body>

<div class="form-container">
  <img src="image/images.jpg" alt="logo">
  <h2>ฟอร์มเช็คชื่อเข้าใช้งาน</h2>

  <form id="checkinForm">
    <input name="fullname" placeholder="ชื่อ - สกุล" required>
    <input name="classroom" placeholder="ชั้น" required>
    <input name="number" placeholder="เลขที่" required>
    <input name="computer" placeholder="เลขเครื่องคอมพิวเตอร์" required>
    <input name="student_id" placeholder="รหัสนักเรียน" required>

    <!-- 🔹 ช่องวันที่ พร้อมคำว่า วันที่ -->
    <input name="date" type="date" placeholder="วันที่" required>

    <input name="logout_time" type="datetime-local" required>

    <button type="submit">ลงทะเบียน</button>
<button type="button" class="stats-btn" onclick="goToStats()">
  เช็คสถิติ
</button>

  </form>
</div>

<script>
document.getElementById("checkinForm").addEventListener("submit", function(e){
  e.preventDefault();

  const formData = {
    fullname: this.fullname.value,
    classroom: this.classroom.value,
    number: this.number.value,
    computer: this.computer.value,
    student_id: this.student_id.value,
    date: this.date.value,
    logout_time: this.logout_time.value
  };

  // ✅ เก็บเวลาออกไว้ใช้ในหน้าสำเร็จ
  localStorage.setItem("logoutTime", this.logout_time.value);

  fetch("https://script.google.com/macros/s/AKfycbwTwPPzOU9EBo713VRitfhPU7EVlBvnXweUTdpotZlOV5N_nnyvs_VGVsTBmnNhIx9D/exec", {
    method: "POST",
    body: JSON.stringify(formData)
  })
  .then(res => res.json())
  .then(data => {
    window.location.href = "success.html";
  });
});
function goToStats(){
  window.location.href = "https://script.google.com/macros/s/AKfycbzMw9znAhjC_G06IJ6Lwe0p5oe4YlC5cswqWfCAdBC58IgHNGGKzVkEDxvt4BfKlcU/exec";
}
</script>


</body>
</html>
