<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าล็อกเอ้า</title>
    <style>
        body {
            font-family: Arial, sans-serif;

            /* สีพื้น + รูปพื้นหลังจาง */
            background-image:
                linear-gradient(
                    rgba(155, 89, 182, 0.6),
                    rgba(255, 255, 255, 0.7)
                ),
                url("รูป/ดอกไม้.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .content-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 350px;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .logout-button {
            background-color: #ff4d4d;
            color: white;
            font-size: 16px;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .logout-button:hover {
            background-color: #e60000;
        }
    </style>
</head>
<body>

    <div class="content-container">
        <h2>คุณออกจากระบบแล้ว</h2>
        <button class="logout-button" onclick="logout()">กดออก</button>
    </div>

    <script>
        function logout() {
            localStorage.removeItem("logoutTime");
            window.location.href = "หน้าล็อกอิน.html";
        }
    </script>

</body>
</html>
